<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMINS PANELS</title>



<style>
/* CSS Reset & Optimization */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --emerald-bg: #020a06;
  --emerald-card: #04140a;
  --emerald-btn: #0a4d26;
  --emerald-btn-hover: #0d6331;
  --gold: #d4af37;
  --text-main: #e8f4ec;
  --text-muted: #9ab5a3;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background-color: var(--emerald-bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Clean, Minimalist Card */
.card {
  background: var(--emerald-card);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 16px;
  padding: 40px 24px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* Simplified Avatar Ring */
.avatar-wrap {
  width: 110px;
  height: 110px;
  margin: 0 auto 24px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--emerald-btn), var(--gold));
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background-image: url('https://pub-2bd0f7d6f1c24613a7d0b319b559a9cc.r2.dev/profiles/newsjpanel-02348b55.webp');
  background-size: cover;
  background-position: center;
  background-color: var(--emerald-bg);
  border: 3px solid var(--emerald-card);
}

/* Professional Typography */
h1 {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.divider {
  width: 60px;
  height: 2px;
  background: var(--gold);
  margin: 0 auto 16px;
  border-radius: 2px;
  opacity: 0.7;
}

.tag-1 {
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.tag-2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 32px;
}

/* High-Conversion, Standard Button with Animation */
.cta {
  display: block;
  background: var(--emerald-btn);
  color: #ffffff;
  text-decoration: none;
  padding: 16px 20px;
  border-radius: 8px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: background 0.3s ease, transform 0.1s ease;
  border: 1px solid rgba(255, 255, 255, 0.1);
  
  /* Animation added here */
  animation: pulseGlow 2.5s infinite;
}

/* Keyframes for the Pulse & Glow effect */
@keyframes pulseGlow {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(10, 77, 38, 0.7);
  }
  50% {
    transform: scale(1.02);
    box-shadow: 0 0 15px 5px rgba(212, 175, 55, 0.25); /* Subtle gold glow */
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
  }
}

.cta:hover {
  background: var(--emerald-btn-hover);
  animation: none; /* Hover par animation ruk jayegi taaki click natural feel ho */
  transform: scale(1.02);
}

.cta:active {
  transform: scale(0.98);
}

.cta-arrow {
  margin-left: 8px;
  color: var(--gold);
}

.hint {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-muted);
  opacity: 0.8;
}
</style>
